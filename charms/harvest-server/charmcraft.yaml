name: harvest-server
type: charm
title: Harvest server
summary: Harvest knowledge graph API server, deployable active/active.
description: |
  Runs the Harvest knowledge-server from the harvest snap. Units share one
  Charmed PostgreSQL database, coordinate through it (locks, presence, event
  bus, agent directory) and are load balanced by the haproxy charm through the
  haproxy-route interface. Any number of units can serve traffic at once.
links:
  source: https://github.com/thinking-dragon/harvest
assumes:
  - juju >= 3.3
base: ubuntu@24.04
platforms:
  amd64:
parts:
  charm:
    plugin: uv
    source: .
    build-snaps:
      - astral-uv

requires:
  database:
    interface: postgresql_client
    limit: 1
  haproxy-route:
    interface: haproxy-route
    limit: 1
    optional: true
  llm-provider:
    interface: harvest_llm_provider
  auth-provider:
    interface: harvest_auth_provider
    optional: true

provides:
  harvest-api:
    interface: harvest_api
    optional: true
  cos-agent:
    interface: cos_agent
    optional: true

peers:
  harvest-peers:
    interface: harvest_peers
  restart:
    interface: rolling_op

resources:
  harvest-snap:
    type: file
    filename: harvest.snap
    description: Optional harvest snap; when attached it is installed instead of the store channel.

config:
  options:
    snap-channel:
      type: string
      default: latest/edge
      description: Store channel of the harvest snap.
    hostname:
      type: string
      default: ""
      description: Public hostname routed to Harvest by haproxy. Defaults to the haproxy external-hostname.
    allow-local-login:
      type: boolean
      default: true
      description: Allow email and password accounts.
    import-secrets:
      type: secret
      description: |
        Juju secret with jwt-secret and user-key-encryption-key to keep the keys of an
        existing deployment. Without it the leader generates new ones.
    pool-size:
      type: int
      default: 16
      description: Database connections per unit.
    max-iterations:
      type: int
      default: 25
      description: Maximum agent iterations per turn.
    drain-timeout:
      type: int
      default: 120
      description: Seconds a stopping unit waits for running turns before aborting them.
    cluster-backend:
      type: string
      default: postgres
      description: |
        Cluster control plane: postgres (heartbeats and NOTIFY in PostgreSQL) or quorium
        (an embedded raft cluster across the units, with a peer mesh event bus).
        Run at least three units with quorium to survive the loss of one.
    active-active:
      type: boolean
      default: true
      description: Allow more than one unit. Set to false to force a single unit.
    extra-toml:
      type: string
      default: ""
      description: Additional server.toml sections (for example [lxd], [collocate] or [semantic]).

actions:
  run-migrations:
    description: Apply pending database migrations now.
  show-status:
    description: Report the node id, schema versions and readiness of this unit.
  cluster-status:
    description: Report cluster mode, local node id, and discovered peer units.
  cluster-rebalance:
    description: Trigger a configuration reconcile on all units.
  cluster-evacuate:
    description: Stop routing new turns to a unit and let its running turns finish.
    params:
      unit:
        type: string
        description: Unit name to evacuate, for example harvest-server/1.
    required:
      - unit
  cluster-restore:
    description: Return an evacuated unit to service.
    params:
      unit:
        type: string
        description: Unit name to restore, for example harvest-server/1.
    required:
      - unit
  cluster-remove:
    description: Remove a unit from the quorium voters and the evacuation records.
    params:
      unit:
        type: string
        description: Unit name to remove, for example harvest-server/1.
    required:
      - unit
  cluster-rotate-secrets:
    description: |
      Rotate the cluster shared secret without downtime: every unit first accepts the new
      secret, then switches to it, then stops accepting the old one.
