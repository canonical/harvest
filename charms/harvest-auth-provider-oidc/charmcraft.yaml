name: harvest-auth-provider-oidc
type: charm
title: Harvest OIDC auth provider
summary: Publishes OIDC authentication configuration to harvest-server.
description: |
  Integrator charm that provides one OIDC authentication provider definition to
  harvest-server over the harvest_auth_provider interface.
assumes:
  - juju >= 3.3
base: ubuntu@24.04
platforms:
  amd64:
parts:
  charm:
    plugin: charm
    source: .

provides:
  auth-provider:
    interface: harvest_auth_provider

config:
  options:
    enabled:
      type: boolean
      default: true
    issuer-url:
      type: string
      default: ""
    client-id:
      type: string
      default: ""
    client-secret:
      type: secret
    display-name:
      type: string
      default: ""
