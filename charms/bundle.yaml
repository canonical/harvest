name: harvest
default-base: ubuntu@24.04

machines:
  "0": {}
  "1": {}
  "2": {}
  "3": {}
  "4": {}
  "5": {}
  "6": {}
  "7": {}
  "8": {}

applications:
  postgresql:
    charm: postgresql
    channel: 16/stable
    revision: 1218
    num_units: 3
    to: ["0", "1", "2"]
    options:
      plugin_pg_trgm_enable: true
      plugin_vector_enable: true

  haproxy:
    charm: haproxy
    channel: 2.8/stable
    revision: 557
    num_units: 1
    to: ["3"]
    options:
      external-hostname: harvest.test

  self-signed-certificates:
    charm: self-signed-certificates
    channel: 1/stable
    revision: 586
    num_units: 1
    to: ["3"]

  harvest-server:
    charm: ./harvest-server/harvest-server_amd64.charm
    num_units: 3
    to: ["4", "5", "6"]
    resources:
      harvest-snap: ./harvest.snap
    options:
      hostname: harvest.test

  harvest-llm-provider-openai-compatible:
    charm: ./harvest-llm-provider-openai-compatible/harvest-llm-provider-openai-compatible_amd64.charm
    num_units: 1
    to: ["4"]
    options:
      model: m
      base-url: http://127.0.0.1:9/v1
      user-provided-key: true

  harvest-web-ui:
    charm: ./harvest-web-ui/harvest-web-ui_amd64.charm
    num_units: 2
    to: ["7", "8"]
    resources:
      harvest-snap: ./harvest.snap
    options:
      hostname: harvest.test

relations:
  - [haproxy:certificates, self-signed-certificates:certificates]
  - [harvest-server:database, postgresql:database]
  - [harvest-server:haproxy-route, haproxy:haproxy-route]
  - [harvest-llm-provider-openai-compatible:llm-provider, harvest-server:llm-provider]
  - [harvest-web-ui:haproxy-route, haproxy:haproxy-route]
  - [harvest-web-ui:harvest-api, harvest-server:harvest-api]
