[package]
name = "harvest-db"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow            = "1"
bytes             = "1"
chrono            = "0.4"
deadpool-postgres = "0.14"
serde_json        = "1"
tokio             = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-postgres    = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1"] }
tracing           = "0.1"
uuid              = { version = "1", features = ["v4"] }
