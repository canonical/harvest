[package]
name = "knowledge-harvester"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime
tokio        = { version = "1", features = ["full"] }
futures      = "0.3"

# Error handling
anyhow       = "1"

# Serialisation
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
toml         = "0.8"

# CLI
clap         = { version = "4", features = ["derive"] }

# Git
git2         = { version = "0.19", features = ["vendored-openssl"] }

# Code parsing
tree-sitter              = "0.26"
streaming-iterator       = "0.1"
tree-sitter-rust         = "0.24"
tree-sitter-python       = "0.25"
tree-sitter-javascript   = "0.25"
tree-sitter-typescript   = "0.23"
tree-sitter-go           = "0.25"
tree-sitter-c            = "0.24"
tree-sitter-cpp          = "0.23"
tree-sitter-java         = "0.23"
tree-sitter-c-sharp      = "0.23"
tree-sitter-ruby         = "0.23"
tree-sitter-php          = "0.25"
tree-sitter-kotlin-ng    = "1.1"
tree-sitter-scala        = "0.26"
tree-sitter-swift        = "0.7"
tree-sitter-lua          = "0.5"
tree-sitter-bash         = "0.25"
tree-sitter-elixir       = "0.3"
tree-sitter-haskell      = "0.24"
tree-sitter-ocaml        = "0.26"
tree-sitter-julia        = "0.23"
tree-sitter-elm          = "5.9"
tree-sitter-dart         = "0.3"
tree-sitter-r            = "1.3"
tree-sitter-zig          = "1.1"
tree-sitter-objc         = "3.0"
tree-sitter-erlang       = "0.21"
tree-sitter-solidity     = "1.2"
tree-sitter-fortran      = "0.6"
tree-sitter-groovy       = "0.1"
tree-sitter-perl         = "1.1"
tree-sitter-d            = "0.8"
tree-sitter-gleam        = "1.0"
tree-sitter-fsharp       = "0.3"
tree-sitter-racket       = "0.25"
tree-sitter-proto        = "0.6"
tree-sitter-verilog      = "1.0"
tree-sitter-matlab       = "1.3"
tree-sitter-pascal       = "0.10"
tree-sitter-nix          = "0.3"
tree-sitter-powershell   = "0.26"
tree-sitter-cuda         = "0.21"
tree-sitter-glsl         = "0.2"
tree-sitter-scheme       = "0.25"
tree-sitter-ada          = "0.9"

# Database
harvest-db   = { path = "../harvest-db" }

# File walking
walkdir      = "2"
ignore       = "0.4"   # respects .gitignore when walking
regex        = "1"

# Logging
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP client (LLM API calls)
reqwest      = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Async trait support
async-trait  = "0.1"

# Temp directories
tempfile     = "3.27.0"

[dev-dependencies]
harvest-db = { path = "../harvest-db" }
serde_json = "1"
httpmock           = "0.8.3"
tempfile = "3.27.0"
