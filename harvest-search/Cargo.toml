[package]
name = "harvest-search"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow      = "1"
async-trait = "0.1"
harvest-db  = { path = "../harvest-db" }
regex       = "1"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
thiserror   = "2"
tokio       = { version = "1", features = ["sync", "rt", "macros", "time", "fs"] }
tracing     = "0.1"

[dev-dependencies]
tempfile    = "3"
tokio       = { version = "1", features = ["full"] }
anyhow      = "1"
