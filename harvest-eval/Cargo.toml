[package]
name = "harvest-eval"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "harvest-eval"
path = "src/main.rs"

[dependencies]
anyhow           = "1"
chrono           = "0.4"
clap             = { version = "4", features = ["derive", "env"] }
futures          = { version = "0.3", default-features = false, features = ["std"] }
harvest-db       = { path = "../harvest-db" }
harvest-search   = { path = "../harvest-search" }
knowledge-server = { path = "../knowledge-server" }
serde            = { version = "1", features = ["derive"] }
serde_json       = "1"
reqwest          = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
toml             = "0.8"
tokio            = { version = "1", features = ["full"] }
tracing          = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile         = "3"
knowledge-harvester = { path = "../knowledge-harvester" }
